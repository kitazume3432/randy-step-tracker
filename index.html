<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランディ ステップトラッカー</title>
<style>
  :root {
    --bg: #faf6f2;
    --card: #ffffff;
    --ink: #2b2320;
    --ink-soft: #8a7d74;
    --line: #eee0d6;
    --orange: #d9502c;
    --orange-deep: #b53d1f;
    --orange-soft: #fdeee7;
    --orange-pale: #fff8f4;
    --amber: #e08a2e;
    --green-bg: #e8f3ea; --green-ink: #2c7a44;
    --gray-bg: #f0eeea; --gray-ink: #8a8178;
    --blue-bg: #eaf1fb; --blue-ink: #2f5f9e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1720px; margin: 0 auto; padding: 26px 22px 60px; }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 18px;
  }
  header.top .title-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-chip {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--orange), var(--orange-deep));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(217,80,44,0.28);
  }
  header.top h1 {
    font-size: 21px;
    margin: 0;
    color: var(--orange-deep);
    letter-spacing: 0.01em;
  }
  header.top .sub {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  /* ---------- Chevron flow bar ---------- */
  .flow-bar {
    display: flex;
    gap: 3px;
    margin-bottom: 20px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(60,30,10,0.08);
  }
  .flow-seg {
    position: relative;
    flex: 1;
    background: var(--orange);
    color: #fff;
    padding: 10px 6px 10px 22px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%);
    cursor: pointer;
    transition: filter 0.15s ease;
    min-width: 74px;
  }
  .flow-seg:first-child { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-left: 14px; }
  .flow-seg .n { display:block; font-size:16px; font-weight:800; margin-top:1px; }
  .flow-seg .lbl { display:block; font-size: 10.5px; font-weight: 500; opacity: 0.92; white-space: nowrap; overflow:hidden; text-overflow:ellipsis;}
  .flow-seg:nth-child(1) { background: #c9c2ba; }
  .flow-seg:nth-child(2) { background: #e8987a; }
  .flow-seg:nth-child(3) { background: #e2825f; }
  .flow-seg:nth-child(4) { background: #dc6c47; }
  .flow-seg:nth-child(5) { background: #d65731; }
  .flow-seg:nth-child(6) { background: var(--orange-deep); }
  .flow-seg:hover { filter: brightness(1.08); }
  .flow-seg.active { outline: 2px solid #3a2418; outline-offset: -2px; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 16px;
  }
  .toolbar input[type="search"] {
    flex: 1 1 200px;
    min-width: 160px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    background: var(--orange-pale);
  }
  .toolbar select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 13px;
    background: var(--orange-pale);
    color: var(--ink);
  }
  .toolbar label.chk {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-soft);
    white-space: nowrap;
  }
  .toolbar .count {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-left: auto;
    white-space: nowrap;
  }
  .toolbar button.ghost {
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--orange);
    background: transparent;
    color: var(--orange-deep);
    font-size: 12.5px;
    cursor: pointer;
  }
  .toolbar button.ghost:hover { background: var(--orange-soft); }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(6, minmax(200px, 1fr));
    gap: 12px;
    align-items: start;
  }
  .column {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 160px;
    max-height: 74vh;
  }
  .column-head {
    padding: 12px 12px 10px;
    border-bottom: 2px solid var(--col-accent, var(--orange));
    border-radius: 12px 12px 0 0;
    background: var(--col-tint, var(--orange-pale));
  }
  .column-head .step-tag {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--col-accent, var(--orange-deep));
    letter-spacing: 0.04em;
  }
  .column-head .step-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 1px;
  }
  .column-head .step-count {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .cards {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 9px 10px;
    background: #fffdfb;
    transition: box-shadow 0.15s ease, transform 0.1s ease;
  }
  .card:hover {
    box-shadow: 0 3px 10px rgba(60,30,10,0.09);
    transform: translateY(-1px);
  }
  .card.churned { opacity: 0.55; background: #f5f2ef; }
  .card .name {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .card .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 5px;
  }
  .tag {
    display: inline-block;
    font-size: 10.5px;
    padding: 1.5px 7px;
    border-radius: 20px;
    font-weight: 600;
    background: var(--gray-bg);
    color: var(--ink-soft);
  }
  .tag.staff { background: var(--blue-bg); color: var(--blue-ink); }
  .tag.date  { background: var(--orange-soft); color: var(--orange-deep); }
  .tag.info  { background: var(--green-bg); color: var(--green-ink); }
  .tag.churn { background: #fbeaea; color: #b7392f; }
  .card .note {
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 5px;
    line-height: 1.4;
  }
  .empty-col {
    padding: 24px 10px;
    text-align: center;
    font-size: 12px;
    color: #c9beb5;
  }

  /* ---------- Land-owned side note ---------- */
  .side-note {
    margin-top: 18px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .side-note summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .side-note .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .side-note .card { width: 200px; }

  footer.note {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: right;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(3, minmax(200px, 1fr)); }
  }
  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr; }
    .wrap { padding: 16px 10px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <div class="logo-chip">ラ</div>
      <div>
        <h1>ランディ ステップトラッカー</h1>
        <div class="sub">土地探しから土地契約までの5ステップで、登録中のお客様の進捗を確認できます</div>
      </div>
    </div>
  </header>

  <div class="flow-bar" id="flowBar"></div>

  <div class="toolbar">
    <input type="search" id="searchBox" placeholder="お客様名で検索...">
    <select id="staffFilter"><option value="">担当：すべて</option></select>
    <label class="chk"><input type="checkbox" id="showChurned"> 削除・解約客も表示</label>
    <button class="ghost" id="resetBtn">リセット</button>
    <span class="count" id="totalCount"></span>
  </div>

  <div class="board" id="board"></div>

  <details class="side-note">
    <summary id="landOwnedSummary">すでに土地あり・ランディ対象外のお客様</summary>
    <div class="cards" id="landOwnedCards"></div>
  </details>

  <footer class="note">元データ: STEP タブ（ランディ集計）｜ステップ区分は「ランディ ステップ資料」に準拠</footer>
</div>

const HEADERS = RAW.headers;
const ROWS = RAW.rows;
const IDX = { month:0, name:2, staff:3, progress:4, land:8, churn:9,
  firstVisit:10, secondVisit:11, idIssue:12, plan:13,
  favorite:14, inquiry:15, inquiryCount:16,
  landConsult:17, designer:18, prescreen:19,
  offer:20, agency:21, planReq:22, buildApp:23, contract:24 };

const COLUMNS = [
  { key:"", tag:"STEP 0", name:"来場・検討開始", accent:"#a89a8d", tint:"#f5f1ec" },
  { key:"ST1", tag:"STEP 1", name:"ID発行・資金計画", accent:"#e2825f", tint:"#fdece4" },
  { key:"ST2", tag:"STEP 2", name:"お気に入り登録", accent:"#dc6c47", tint:"#fce6dc" },
  { key:"ST3", tag:"STEP 3", name:"土地相談", accent:"#d65731", tint:"#fbe0d3" },
  { key:"ST4", tag:"STEP 4", name:"仮審査", accent:"#c94824", tint:"#fad9ca" },
  { key:"ST5", tag:"STEP 5", name:"買付・建築申込", accent:"#b53d1f", tint:"#f8d1bf" },
];

function isChurned(r) { return r[IDX.churn] === "削除"; }
function ownsLand(r) { return r[IDX.land] === "有"; }

function cardNote(r, colKey) {
  const parts = [];
  if (colKey === "" ) {
    if (r[IDX.firstVisit]) parts.push("初回来場 " + r[IDX.firstVisit]);
  } else if (colKey === "ST1") {
    if (r[IDX.idIssue]) parts.push("ID発行 " + r[IDX.idIssue]);
    if (r[IDX.plan]) parts.push("資金計画 " + r[IDX.plan]);
  } else if (colKey === "ST2") {
    if (r[IDX.favorite]) parts.push("お気に入り登録 " + r[IDX.favorite]);
    if (r[IDX.inquiryCount]) parts.push("問合数 " + r[IDX.inquiryCount]);
  } else if (colKey === "ST3") {
    if (r[IDX.designer]) parts.push("担当設計 " + r[IDX.designer]);
  } else if (colKey === "ST4") {
    if (r[IDX.prescreen]) parts.push("仮審査 " + r[IDX.prescreen]);
  } else if (colKey === "ST5") {
    if (r[IDX.agency]) parts.push("提携先 " + r[IDX.agency]);
    if (r[IDX.buildApp]) parts.push("建築申込 " + r[IDX.buildApp]);
    if (r[IDX.contract]) parts.push("契約 " + r[IDX.contract]);
  }
  return parts.join(" ／ ");
}

function makeCard(r, colKey) {
  const churned = isChurned(r);
  const note = cardNote(r, colKey);
  return `<div class="card ${churned ? "churned" : ""}">
    <div class="name">${r[IDX.name]}</div>
    <div class="meta">
      <span class="tag staff">${r[IDX.staff]}</span>
      ${churned ? '<span class="tag churn">削除</span>' : ""}
      ${r[IDX.month] ? `<span class="tag date">${r[IDX.month]}</span>` : ""}
    </div>
    ${note ? `<div class="note">${note}</div>` : ""}
  </div>`;
}

function currentRows() {
  const q = document.getElementById("searchBox").value.trim();
  const staff = document.getElementById("staffFilter").value;
  const showChurned = document.getElementById("showChurned").checked;
  return ROWS.filter(r => {
    if (q && !r[IDX.name].includes(q)) return false;
    if (staff && r[IDX.staff] !== staff) return false;
    if (!showChurned && isChurned(r)) return false;
    return true;
  });
}

function render() {
  const rows = currentRows();
  const activeRows = rows.filter(r => !ownsLand(r));
  const landRows = rows.filter(r => ownsLand(r));

  // flow bar counts
  const flowBar = document.getElementById("flowBar");
  flowBar.innerHTML = COLUMNS.map(c => {
    const cnt = activeRows.filter(r => r[IDX.progress] === c.key).length;
    return `<div class="flow-seg" style="background:${c.accent}">
      <span class="lbl">${c.tag}</span>
      <span class="n">${cnt}</span>
      <span class="lbl">${c.name}</span>
    </div>`;
  }).join("");

  // board
  const board = document.getElementById("board");
  board.innerHTML = COLUMNS.map(c => {
    const items = activeRows.filter(r => r[IDX.progress] === c.key);
    const body = items.length
      ? items.map(r => makeCard(r, c.key)).join("")
      : `<div class="empty-col">該当なし</div>`;
    return `<div class="column" style="--col-accent:${c.accent}; --col-tint:${c.tint}">
      <div class="column-head">
        <div class="step-tag">${c.tag}</div>
        <div class="step-name">${c.name}</div>
        <div class="step-count">${items.length} 件</div>
      </div>
      <div class="cards">${body}</div>
    </div>`;
  }).join("");

  // land-owned side note
  document.getElementById("landOwnedSummary").textContent =
    `すでに土地あり・ランディ対象外のお客様（${landRows.length} 件）`;
  document.getElementById("landOwnedCards").innerHTML =
    landRows.map(r => makeCard(r, "")).join("") || `<div class="empty-col">該当なし</div>`;

  document.getElementById("totalCount").textContent =
    `表示中 ${rows.length} / 全 ${ROWS.length} 件`;
}

function populateStaffSelect() {
  const set = new Set();
  ROWS.forEach(r => { if (r[IDX.staff]) set.add(r[IDX.staff]); });
  const sel = document.getElementById("staffFilter");
  Array.from(set).sort().forEach(v => {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

document.getElementById("searchBox").addEventListener("input", render);
document.getElementById("staffFilter").addEventListener("change", render);
document.getElementById("showChurned").addEventListener("change", render);
document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("searchBox").value = "";
  document.getElementById("staffFilter").value = "";
  document.getElementById("showChurned").checked = false;
  render();
});

populateStaffSelect();
render();
</script>
